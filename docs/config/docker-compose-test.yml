networks:
  geo-labyrinth:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  mgmt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  oblivion-logs:
  router-configs:
  monitoring-data:

services:
  # Primary Entry Router
  oblivion-primary:
    build:
      context: ../../OblivionEdge-OblivionEdge_Dev
      dockerfile: Dockerfile.router
    container_name: oblivion-primary
    hostname: primary-router
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.default.rp_filter=2
      - net.ipv4.conf.all.rp_filter=2
    networks:
      geo-labyrinth:
        ipv4_address: 172.20.0.10
      mgmt-network:
        ipv4_address: 172.21.0.10
    volumes:
      - ./router_configs/primary:/etc/oblivion
      - oblivion-logs:/var/log/oblivion
    environment:
      - ROUTER_ROLE=primary
      - GEOGRAPHIC_LOCATION=primary
    ports:
      - "8443:8443"
      - "51820:51820/udp"
      - "9001:9001"
    dns:
      - 8.8.8.8
      - 8.8.4.4

