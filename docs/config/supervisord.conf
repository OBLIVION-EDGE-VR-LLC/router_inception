[supervisord]
nodaemon=true
user=root
logfile=/var/log/oblivion/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:oblivion-ztna]
command=/usr/bin/oblivion_ztna_daemon
autostart=true
autorestart=true
stderr_logfile=/var/log/oblivion/ztna.err.log
stdout_logfile=/var/log/oblivion/ztna.out.log
environment=ROUTER_ROLE="%(ENV_ROUTER_ROLE)s",GEOGRAPHIC_LOCATION="%(ENV_GEOGRAPHIC_LOCATION)s"

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock