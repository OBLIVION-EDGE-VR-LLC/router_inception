[ztna]
enabled = true
policy_file = /etc/oblivion/policies/default.json
certificate_store = /etc/oblivion/certs/
tpm_enabled = true
attestation_required = true
session_timeout = 3600

[authentication]
method = certificate
ca_cert = /etc/oblivion/certs/ca.crt
server_cert = /etc/oblivion/certs/server.crt
server_key = /etc/oblivion/certs/server.key

[network]
listen_interface = eth0
tunnel_interface = wg0
next_hop = 172.20.0.20

[monitoring]
packet_capture = true
forensic_logging = true
suspect_monitoring = true
log_level = info
