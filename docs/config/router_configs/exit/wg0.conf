[Interface]
PrivateKey = gNZnkqf8qR6YYV2vwpTtHzmgzLS4a6WmZ7L984FK3m4=
Address = 10.0.6.1/24
ListenPort = 51825
MTU = 1280
Table = off
# Keep Docker-bridge default; only return packets bound for the chain hit wg0.
PostUp = ip route replace 10.0.1.0/24 dev %i
PostUp = ip route replace 10.0.2.0/24 dev %i
PostUp = iptables -A FORWARD -i %i -o eth0 -j ACCEPT
PostUp = iptables -A FORWARD -i eth0 -o %i -m state --state RELATED,ESTABLISHED -j ACCEPT
PostUp = iptables -t mangle -A FORWARD -o eth0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = ip route del 10.0.1.0/24 dev %i
PostDown = ip route del 10.0.2.0/24 dev %i
PostDown = iptables -D FORWARD -i %i -o eth0 -j ACCEPT
PostDown = iptables -D FORWARD -i eth0 -o %i -m state --state RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t mangle -D FORWARD -o eth0 -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# Upstream (middle) — ONLY peer; AllowedIPs covers chain /24s, NOT 0.0.0.0/0.
# Catch-all here would loop replies back into the tunnel instead of out eth0.
PublicKey = K28HL89nxhrlQGxcXimwW5U5KOal9HHoTQkoV7odHms=
AllowedIPs = 10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24, 10.0.4.0/24, 10.0.5.0/24, 10.0.6.0/24
PersistentKeepalive = 25