[exit]
enabled = true
soho_network = 192.168.1.0/24
soho_interface = eth1
tunnel_interface = wg0
nat_enabled = true
firewall_enabled = true

[services]
dhcp_enabled = true
dns_enabled = true
http_redirect = true
https_proxy = false

[security]
firewall_default = drop
allow_icmp = true
allow_dhcp = true
allow_dns = true
block_private_subnets = false

[monitoring]
traffic_logging = true
connection_tracking = true
bandwidth_monitoring = true
