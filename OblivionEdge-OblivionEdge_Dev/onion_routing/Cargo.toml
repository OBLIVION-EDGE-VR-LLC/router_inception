[package]
name = "onion_routing"
version = "0.1.0"
edition = "2021"
authors = ["OBLIVION EDGE LLC <1337_tech@fortressofsolitude.org>"]

[dependencies]
# Async runtime
tokio = { version = "1.28", features = ["full"] }

# Cryptography
ring = "0.16"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Network utilities
socket2 = "0.4"

# System integration
libc = "0.2"

[lib]
name = "onion_routing"
path = "lib.rs"

[[bin]]
name = "onion-client"
path = "bin/onion-client.rs"

[[bin]]
name = "onion-server"
path = "bin/onion-server.rs"